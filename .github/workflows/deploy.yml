name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun/Node
        uses: oven-sh/setup-bun@v1 # Hoặc dùng actions/setup-node nếu bạn muốn dùng npm/node

      - name: Install dependencies
        run: bun install # Thay bằng npm install nếu bạn dùng npm

      - name: Build project
        run: bun run build # Thay bằng npm run build nếu bạn dùng npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Thư mục chứa bản build sau khi chạy lệnh build của Vite

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
