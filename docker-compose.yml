version: '3.8'

services:
  sacombank-ai-web:
    build: .
    container_name: sacombank_ai_assistant
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://scb_user:scb_password@postgres:5432/sacombank_rag
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sacombank_pgvector
    restart: always
    environment:
      POSTGRES_USER: scb_user
      POSTGRES_PASSWORD: scb_password
      POSTGRES_DB: sacombank_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: sacombank_cache
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
